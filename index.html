function resultData(){const raw=Array(12).fill(0);seq.slice(0,15).forEach((it,i)=>{const dm=dims(it);raw[dm[sel[i].m]]++;raw[dm[sel[i].l]]--});const u=raw.map(x=>(x+5)/10*9),all=rank(u,ALL),ex=all.map(x=>Math.exp(x.r/.15)),z=ex.reduce((a,b)=>a+b);all.forEach((x,i)=>x.p=ex[i]/z*100);const P=all[0].a,S2=all[1],gap=all[0].r-S2.r,edge=gap<.08;let ok=0;R.forEach((r,j)=>{const a=dims(seq[15+j]),b=dims(seq[r]),x=sel[15+j],y=sel[r];ok+=(a[x.m]===b[y.m])+(a[x.l]===b[y.l])});const clear=profileClarity(raw),certainty=archetypeCertainty(all[0].r,all[1].r),lounge=loungeData(u),cross=(lounge[0].r-lounge[1].r)<.10,bar=roleData(BARDIMS,u),guest=roleData(GUESTDIMS,u),rp=pctOf(all[0].r,NR);return{raw,u,all,P,S2,gap,edge,ok,clear,certainty,lounge,cross,bar,guest,rp}}
function metricCard(label,value,state,text){return `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div><div class="state">${state}</div><p>${text}</p></div>`}
function relationData(P){
 const rel=A.filter(a=>a!==P).map(a=>({a,r:cos(cen(P.v,ALL),cen(a.v,ALL))})).sort((x,y)=>y.r-x.r);

 const crush=rel.find(x=>x.a!==soulmate.a&&x.a.k===P.k)||rel[1];
 const nemesis=rel[rel.length-1];
 return {soulmate,work,crush,nemesis};
}

function roleCard(title,sub,d){return `<div class="role-card"><div class="section-kicker">${title}</div>${d.flat?`<h3>信息不足</h3><p class="role-z">这一侧的 6 个维度几乎没有起伏</p><p>${sub}</p><small>作答太平，不下结论。看主型和另一侧更可靠。</small>`:`<h3>${d.P.n}</h3><p class="role-z">${d.P.z}</p><p>${sub}</p><small>前三：${d.top3.map(x=>x.a.n).join(' · ')} · 6 维子轮廓，仅供参考</small>`}</div>`}
